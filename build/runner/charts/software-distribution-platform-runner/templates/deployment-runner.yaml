apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.basic.component }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.basic.component }}
    version: v1
spec:
  replicas: {{ .Values.basic.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.basic.component }}
      version: v1
  template:
    metadata:
      annotations: {}
      labels:
        app: {{ .Values.basic.component }}
        version: v1
    spec:
      serviceAccountName: sdp-runner
      containers:
        - name: container-1
          env:
            - name: HUB_GATEWAY_URL
              value: {{ .Values.gateway.url }}
            - name: TARGET_NAME
              value: {{ .Values.target.name }}
            - name: TARGET_AUTH_TOKEN
              value: {{ .Values.target.authToken }}
            # ADR-0001 首连自注册：两者都非空时随每次拨号透传（X-Target-Vendor/Region），
            # hub 对未注册 target 自动建行；置空则保持严格的 404-on-unknown 行为。
            - name: TARGET_VENDOR
              value: {{ .Values.target.vendor | quote }}
            - name: TARGET_REGION
              value: {{ .Values.target.region | quote }}
            # G-7：job 默认镜像可按环境覆盖；G-6：consume 下载走 hub API。
            - name: SDP_JOB_IMAGE_GIT
              value: {{ .Values.jobImages.git }}
            - name: SDP_JOB_IMAGE_ARTIFACT
              value: {{ .Values.jobImages.artifact }}
            - name: SDP_JOB_IMAGE_HELM
              value: {{ .Values.jobImages.helm }}
            - name: SDP_JOB_IMAGE_KUBECTL
              value: {{ .Values.jobImages.kubectl }}
            - name: SDP_HUB_BASE_URL
              value: {{ .Values.hubApi.url }}
            - name: SDP_HUB_API_TOKEN
              value: {{ .Values.hubApi.token }}
{{- if .Values.selfUpgrade.enabled }}
            # 自升级（INSTALL-UPGRADE-EXECUTOR-DESIGN §4.1）：deployment/container/SA
            # 默认与本 chart 部署形态一致；SDP_RUNNER_IMAGE 是不带 tag 的镜像名
            # （upgrade op 的 Detail 携带目标版本，runner 侧拼回 name:version）。
            - name: SDP_RUNNER_NAMESPACE
              value: {{ .Values.namespace }}
            - name: SDP_RUNNER_DEPLOYMENT
              value: {{ .Values.basic.component }}
            - name: SDP_RUNNER_CONTAINER
              value: container-1
            - name: SDP_UPGRADE_SA
              value: sdp-runner
            - name: SDP_RUNNER_IMAGE
              value: {{ .Values.image.imageAddr | splitList ":" | first }}
{{- else }}
            - name: SDP_UPGRADE_DISABLED
              value: "true"
{{- end }}
          image: {{ .Values.image.imageAddr }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.resources.resources_cpu_requests }}
              memory: {{ .Values.resources.resources_mem_requests }}
            limits:
              cpu: {{ .Values.resources.resources_cpu_limits }}
              memory: {{ .Values.resources.resources_mem_limits }}
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  progressDeadlineSeconds: 600
