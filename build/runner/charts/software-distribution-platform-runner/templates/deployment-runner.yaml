apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.basic.component }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.basic.component }}
    version: v1
spec:
  replicas: {{ .Values.basic.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.basic.component }}
      version: v1
  template:
    metadata:
      annotations: {}
      labels:
        app: {{ .Values.basic.component }}
        version: v1
    spec:
      serviceAccountName: sdp-runner
      containers:
        - name: container-1
          env:
            - name: HUB_GATEWAY_URL
              value: {{ .Values.gateway.url }}
            - name: TARGET_NAME
              value: {{ .Values.target.name }}
            - name: TARGET_AUTH_TOKEN
              value: {{ .Values.target.authToken }}
            # G-7：job 默认镜像可按环境覆盖；G-6：consume 下载走 hub API。
            - name: SDP_JOB_IMAGE_GIT
              value: {{ .Values.jobImages.git }}
            - name: SDP_JOB_IMAGE_ARTIFACT
              value: {{ .Values.jobImages.artifact }}
            - name: SDP_JOB_IMAGE_HELM
              value: {{ .Values.jobImages.helm }}
            - name: SDP_JOB_IMAGE_KUBECTL
              value: {{ .Values.jobImages.kubectl }}
            - name: SDP_HUB_BASE_URL
              value: {{ .Values.hubApi.url }}
            - name: SDP_HUB_API_TOKEN
              value: {{ .Values.hubApi.token }}
          image: {{ .Values.image.imageAddr }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.resources.resources_cpu_requests }}
              memory: {{ .Values.resources.resources_mem_requests }}
            limits:
              cpu: {{ .Values.resources.resources_cpu_limits }}
              memory: {{ .Values.resources.resources_mem_limits }}
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  progressDeadlineSeconds: 600
