apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.basic.component }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.basic.component }}
    version: v1
spec:
  replicas: {{ .Values.basic.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.basic.component }}
      version: v1
  template:
    metadata:
      annotations: {}
      labels:
        app: {{ .Values.basic.component }}
        version: v1
    spec:
      serviceAccountName: sdp-runner
      # 镜像拉取凭据：runner 用自定义 SA sdp-runner（不继承 default SA 的 patch），
      # 必须在 pod spec 显式声明；留空则不渲染（无鉴权 registry 场景）。
      {{- if .Values.image.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image.imagePullSecrets }}
      {{- end }}
      containers:
        - name: container-1
          env:
            - name: HUB_GATEWAY_URL
              value: {{ .Values.hub.gatewayUrl }}
            # hub 后端 TLS：runner 挂 CA 后凭 SSL_CERT_FILE 建立信任（gorilla 默认
            # dialer 走系统池，Linux 读该变量）；caSecretName 留空则不挂载、不注入。
            {{- if .Values.hub.caSecretName }}
            - name: SSL_CERT_FILE
              value: /etc/hub-certs/ca.crt
            {{- end }}
            - name: TARGET_NAME
              value: {{ .Values.target.name }}
            - name: TARGET_AUTH_TOKEN
              value: {{ .Values.target.authToken }}
            # ADR-0001 首连自注册：两者都非空时随每次拨号透传（X-Target-Vendor/Region），
            # hub 对未注册 target 自动建行；置空则保持严格的 404-on-unknown 行为。
            - name: TARGET_VENDOR
              value: {{ .Values.target.vendor | quote }}
            - name: TARGET_REGION
              value: {{ .Values.target.region | quote }}
            # G-7：job 默认镜像可按环境覆盖；G-6：consume 下载走 hub API。
            - name: SDP_JOB_IMAGE_GIT
              value: {{ .Values.jobImages.git }}
            - name: SDP_JOB_IMAGE_ARTIFACT
              value: {{ .Values.jobImages.artifact }}
            - name: SDP_JOB_IMAGE_HELM
              value: {{ .Values.jobImages.helm }}
            - name: SDP_JOB_IMAGE_KUBECTL
              value: {{ .Values.jobImages.kubectl }}
            - name: SDP_HUB_BASE_URL
              value: {{ .Values.hub.apiBaseUrl }}
            - name: SDP_HUB_API_TOKEN
              value: {{ .Values.hub.apiToken | quote }}
            {{- if .Values.hub.caSecretName }}
            - name: SDP_HUB_CA_FILE
              value: /etc/hub-certs/ca.crt
            {{- end }}
{{- if .Values.selfUpgrade.enabled }}
            # 自升级（INSTALL-UPGRADE-EXECUTOR-DESIGN §4.1）：deployment/container/SA
            # 默认与本 chart 部署形态一致；SDP_RUNNER_IMAGE 是不带 tag 的镜像名
            # （upgrade op 的 Detail 携带目标版本，runner 侧拼回 name:version）。
            - name: SDP_RUNNER_NAMESPACE
              value: {{ .Values.namespace }}
            - name: SDP_RUNNER_DEPLOYMENT
              value: {{ .Values.basic.component }}
            - name: SDP_RUNNER_CONTAINER
              value: container-1
            - name: SDP_UPGRADE_SA
              value: sdp-runner
            - name: SDP_RUNNER_IMAGE
              value: {{ .Values.image.imageAddr | splitList ":" | first }}
{{- else }}
            - name: SDP_UPGRADE_DISABLED
              value: "true"
{{- end }}
{{- if .Values.rollout.serviceTargetPort }}
            # canary 发布 <workload>-sdp 服务 targetPort 强制覆盖（缺省从 stable workload 推断）
            - name: SDP_ROLLOUT_SVC_TARGET_PORT
              value: {{ .Values.rollout.serviceTargetPort | quote }}
{{- end }}
          image: {{ .Values.image.imageAddr }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.hub.caSecretName }}
          volumeMounts:
            - name: hub-certs
              mountPath: /etc/hub-certs
              readOnly: true
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.resources_cpu_requests }}
              memory: {{ .Values.resources.resources_mem_requests }}
            limits:
              cpu: {{ .Values.resources.resources_cpu_limits }}
              memory: {{ .Values.resources.resources_mem_limits }}
      {{- if .Values.hub.caSecretName }}
      # runner 把该 CA 内容同步为 job 所在 ns 的 ConfigMap（taskrun 控制器），
      # job Pod 挂载后凭 SSL_CERT_FILE 让 curl 信任 hub 后端 TLS（用户脚本零改动）。
      volumes:
        - name: hub-certs
          secret:
            secretName: {{ .Values.hub.caSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  progressDeadlineSeconds: 600
