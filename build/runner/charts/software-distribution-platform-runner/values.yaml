# 默认命名空间（与 hub chart 同约定：所有名字空间内资源注入 metadata.namespace，默认 sdp-workflow）
namespace: sdp-workflow

basic:
  # k8s 资源名统一用短名（镜像名才是全名）
  component: runner
  replicaCount: 1

image:
  imageAddr: harbor.sdpworkflow.com/sdp/software-distribution-platform-runner:v0.0.1
  pullPolicy: Always

resources:
  resources_cpu_requests: 100m
  resources_cpu_limits: 500m
  resources_mem_requests: 128Mi
  resources_mem_limits: 512Mi

# gateway 配置须与 hub chart 成对修改（hub 在 sdp-workflow）
gateway:
  url: ws://hub.sdp-workflow.svc:8080/gateway/ws
  token: sdp-dev-token-2026

# target 对接信息（ADR-0001 首连自注册）：vendor/region 都非空时，runner 每次拨号
# 把它们随 X-Target-Vendor/X-Target-Region 透传，hub 在持有合法 gateway token 的前提
# 下对未注册 target 自动建行（GitLab-Runner 式安装即注册）——无需再手工 POST /targets。
# 仅 name+authToken（vendor/region 置空）= 旧行为：未注册直接 404，重试待人工注册。
target:
  name: local-dev
  authToken: sdp-dev-token-2026
  vendor: kind
  region: local

# G-7：执行 Job 的四个默认镜像可按环境覆盖（受限 registry 换成私有 mirror 即可）；
# G-6：consume init 容器走 hub API 下载产物 —— hubApi.url 必须是 job Pod 可达的
# 地址，hubApi.token 为可选的 Bearer（hub 关闭鉴权时留空）。
jobImages:
  git: alpine/git:2.45.2
  artifact: curlimages/curl:8.8.0
  helm: alpine/helm:3.14.4
  kubectl: bitnami/kubectl:1.30

hubApi:
  url: http://hub.sdp-workflow.svc:8080
  token: ""
