# 默认命名空间（与 hub chart 同约定：所有名字空间内资源注入 metadata.namespace，默认 sdp-workflow）
namespace: sdp-workflow

basic:
  # k8s 资源名统一用短名（镜像名才是全名）
  component: runner
  replicaCount: 1

image:
  imageAddr: harbor.sdpworkflow.com/sdp/software-distribution-platform-runner:v0.0.1
  pullPolicy: Always
  # pod spec 级拉取凭据名（与 console chart 同款字段）；runner 用自定义 SA
  # sdp-runner，不吃 default SA 的凭据注入，必须在此显式声明。
  # 留空 = 不渲染 imagePullSecrets（registry 无鉴权场景）。
  imagePullSecrets: default-secret

resources:
  resources_cpu_requests: 100m
  resources_cpu_limits: 500m
  resources_mem_requests: 128Mi
  resources_mem_limits: 512Mi

# hub 连接契约：runner 消费 hub 的两个入口（WS 回流 + REST API）。
# gatewayUrl 指向 hub 进程内的 runner 网关端点（hub 仓 internal/gateway 模块，env 名
# HUB_GATEWAY_URL 沿用该历史命名）——不是 Envoy Gateway。hub 后端 8080 为 TLS
# （wss/https 同端口），自签 CA 由 cert-create.sh 统一生成（SAN 覆盖 hub svc 名链）。
# 集群内部署默认直连 svc；集群外 runner 把两个 URL 覆盖为网关对外地址
# （wss://<host>/gateway/ws 与 https://<host>），caSecretName 引用本命名空间内
# 含 ca.crt 的 secret（无则留空，走系统信任池，适用于真实 PKI）。
hub:
  gatewayUrl: wss://hub.sdp-workflow.svc:8080/gateway/ws
  apiBaseUrl: https://hub.sdp-workflow.svc:8080
  apiToken: ""
  caSecretName: hub-tls

# target 对接信息（ADR-0001 首连自注册）：vendor/region 都非空时，runner 每次拨号
# 把它们随 X-Target-Vendor/X-Target-Region 透传，hub 在持有合法 gateway token 的前提
# 下对未注册 target 自动建行（GitLab-Runner 式安装即注册）——无需再手工 POST /targets。
# 仅 name+authToken（vendor/region 置空）= 旧行为：未注册直接 404，重试待人工注册。
target:
  name: local-dev
  authToken: sdp-dev-token-2026
  vendor: kind
  region: local

# G-7：执行 Job 的四个默认镜像可按环境覆盖（受限 registry 换成私有 mirror 即可）。
jobImages:
  git: alpine/git:2.45.2
  artifact: curlimages/curl:8.8.0
  helm: alpine/helm:3.14.4
  kubectl: bitnami/kubectl:1.30

# 自升级（INSTALL-UPGRADE-EXECUTOR-DESIGN §4.1）：hub 派发 upgrade op 时，runner
# 在自身命名空间创建「kubectl set image + rollout status」Job 自我替换，终态由
# hub 侧 agent_info 版本对账收口（旧 Pod 终止导致 WS 中断是预期）。
# enabled=false 注入 SDP_UPGRADE_DISABLED=true：runner 对 upgrade op 显式回
# failed（不静默、不走 in-cluster 兜底）。开启前提：
#   ① 目标版本镜像须已推入 harbor（升级 = 换 tag，不触发任何构建）；
#   ② SA（sdp-runner）持有本 ns deployments patch 权限（chart rbac.yaml 的
#      ClusterRole 已含，无需追加）；
#   ③ kubectl 升级镜像默认 harbor.sdpworkflow.com/sdp/kubectl:1.30（runner 代码
#      默认值，可用 SDP_UPGRADE_KUBECTL_IMAGE 覆盖）。
selfUpgrade:
  enabled: false

# canary 发布：<workload>-sdp 流量服务的 targetPort。缺省自动取 stable workload
# 已声明的第一个容器端口，无声明时兜底 8080；显式设置即强制覆盖（端口冲突环境用）。
rollout:
  serviceTargetPort: ""
