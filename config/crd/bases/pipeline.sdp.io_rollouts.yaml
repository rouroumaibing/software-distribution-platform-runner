---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: rollouts.pipeline.sdp.io
spec:
  group: pipeline.sdp.io
  names:
    kind: Rollout
    listKind: RolloutList
    plural: rollouts
    singular: rollout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentWeight
      name: Weight
      type: integer
    - jsonPath: .spec.workloadRef
      name: Workload
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Rollout is the Schema for the rollouts API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RolloutSpec defines the desired state of a Rollout.
              Created by the PipelineRun/TaskRun controller for Deploy-type tasks, or
              directly by an operator for a standalone progressive deployment.
            properties:
              autoRollback:
                default: true
                description: |-
                  AutoRollback, when true, automatically reverts to 0% canary weight
                  once HealthCheck.FailureThreshold consecutive checks fail.
                type: boolean
              canaryImage:
                type: string
              healthCheck:
                description: HealthCheckSpec defines how canary health is evaluated
                  at each step.
                properties:
                  failureThreshold:
                    default: 3
                    description: |-
                      FailureThreshold is the number of consecutive failed checks before
                      the controller triggers a rollback (if AutoRollback is true).
                    format: int32
                    type: integer
                  httpPath:
                    description: |-
                      HTTPPath is used when Type == HTTPProbe, evaluated against the
                      canary Pods directly.
                    type: string
                  intervalSeconds:
                    default: 30
                    description: IntervalSeconds between health evaluations.
                    format: int64
                    type: integer
                  prometheusQueryExpr:
                    description: |-
                      PrometheusQueryExpr / PrometheusThreshold are used when
                      Type == PrometheusQuery, e.g. checking canary error rate against a
                      configured ceiling.
                    type: string
                  prometheusThreshold:
                    type: string
                  type:
                    description: |-
                      HealthCheckType selects how the rollout controller judges canary health
                      at each step before advancing to the next one.
                    enum:
                    - PodReady
                    - HTTPProbe
                    - PrometheusQuery
                    type: string
                required:
                - type
                type: object
              stableImage:
                type: string
              steps:
                description: Steps defines the full progressive delivery plan, evaluated
                  in order.
                items:
                  description: |-
                    CanaryStep is one step of a progressive rollout: shift weight, then
                    optionally pause before the controller evaluates health and proceeds.
                  properties:
                    pause:
                      description: |-
                        Pause holds the rollout at the current weight. Omit both SetWeight
                        and Pause is invalid; a step must do at least one of the two.
                      properties:
                        duration:
                          description: |-
                            Duration to pause for; if omitted, pause is indefinite until resumed
                            externally (e.g. by an operator approving progression, relayed via
                            the hub patching Rollout.Spec or a resume annotation).
                          type: string
                      type: object
                    setWeight:
                      description: SetWeight is the percentage of traffic (0-100)
                        routed to the canary version.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                  type: object
                minItems: 1
                type: array
              trafficRouting:
                description: |-
                  TrafficRoutingSpec defines how traffic is actually split between
                  stable and canary versions of the workload.
                properties:
                  ingressRef:
                    description: IngressRef is required when Type == IngressCanary.
                    type: string
                  type:
                    description: TrafficRoutingType selects how canary traffic is
                      split.
                    enum:
                    - DeploymentWeight
                    - IngressCanary
                    type: string
                required:
                - type
                type: object
              workloadRef:
                description: WorkloadRef is the name of the Deployment being progressively
                  updated.
                type: string
            required:
            - canaryImage
            - healthCheck
            - stableImage
            - steps
            - trafficRouting
            - workloadRef
            type: object
          status:
            description: RolloutStatus defines the observed state of a Rollout.
            properties:
              canaryReplicas:
                format: int32
                type: integer
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFailures:
                format: int32
                type: integer
              currentStepIndex:
                format: int32
                type: integer
              currentWeight:
                format: int32
                type: integer
              lastHealthCheckTime:
                format: date-time
                type: string
              message:
                type: string
              phase:
                description: RolloutPhase represents the lifecycle phase of a Rollout.
                enum:
                - Progressing
                - Paused
                - Healthy
                - Degraded
                - RollingBack
                type: string
              stableReplicas:
                format: int32
                type: integer
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
