                        format: int32
                        type: integer
                      stableImage:
                        type: string
                      steps:
                        description: Steps defines the full progressive delivery plan,
                          evaluated in order.
                        items:
                          description: |-
                            CanaryStep is one step of a progressive rollout: shift weight, then
