                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              exitCode:
                format: int32
                type: integer
              jobRef:
                description: |-
                  JobRef is the name of the Kubernetes Job this TaskRun created
                  (Normal tasks only; Deploy tasks use RolloutRef instead).
                type: string
              logsRef:
                description: |-
                  LogsRef points to where full logs are archived once the Pod is gone
                  (e.g. an object storage key). Live logs are streamed directly from
                  the Pod through the runner's connector, not stored on this object.
                type: string
              message:
                type: string
              phase:
                description: TaskRunPhase represents the lifecycle phase of a single
                  TaskRun.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Skipped
                type: string
              podName:
                type: string
              retryCount:
                format: int32
                type: integer
              rolloutRef:
                description: RolloutRef is the name of the Rollout this TaskRun created
                  (Deploy tasks only).
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
